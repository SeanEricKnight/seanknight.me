name: Localize homepage images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  localize:
    if: ${{ !contains(github.event.head_commit.message, '[localize-images]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download local image assets
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/SeanEricKnight/christianityapparently.com/main/assets/Headshot.png" -o assets/sean-knight.png
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1746385129996-ac3fc19cc2ed?auto=format&fit=crop&fm=jpg&q=82&w=1400" -o assets/christianity.jpg
          curl -L --fail --retry 3 "https://images.unsplash.com/photo-1506399558188-acca6f8cbf41?auto=format&fit=crop&fm=jpg&q=82&w=1400" -o assets/ai-lab.jpg

      - name: Switch homepage references to local assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          s = s.replace("https://christianityapparently.com/assets/Headshot.png", "https://seanknight.me/assets/sean-knight.png")
          s = s.replace('src="https://seanknight.me/assets/sean-knight.png"', 'src="assets/sean-knight.png"', 1)
          s = s.replace("https://images.unsplash.com/photo-1746385129996-ac3fc19cc2ed?auto=format&amp;fit=crop&amp;fm=jpg&amp;q=78&amp;w=1400", "assets/christianity.jpg")
          s = s.replace("https://images.unsplash.com/photo-1506399558188-acca6f8cbf41?auto=format&amp;fit=crop&amp;fm=jpg&amp;q=78&amp;w=1400", "assets/ai-lab.jpg")
          p.write_text(s)
          PY

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/localize-homepage-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .github/workflows/localize-homepage-images.yml
          git commit -m "Store homepage images locally [localize-images]"
          git push
